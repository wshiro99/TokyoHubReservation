<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Hub 空間預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-start sm:items-center justify-center p-4 py-8">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Startup Island TAIWAN</h1>
            <p class="text-sm text-slate-500 mt-1">Tokyo Hub 空間預約系統</p>
            <p class="text-xs text-slate-400 mt-2">先選空間和日期，下面的時段圖會即時顯示哪些時間已經被預約</p>
        </div>

        <form id="booking-form" class="space-y-5" onsubmit="submitBooking(event)">

            <!-- 步驟 1：空間與日期 -->
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">1. 選擇預約空間</label>
                    <select id="space" onchange="onSpaceOrDateChange()" class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Room A">Meeting Room A (上限 10 人)</option>
                        <option value="Room B">Meeting Room B (上限 8 人)</option>
                        <option value="Room C">Meeting Room C (上限 8 人)</option>
                        <option value="Room B & C">Room B & C 聯通大空間</option>
                        <option value="Hot Desk">Hot Desk (流動辦公桌/全天)</option>
                    </select>
                    <p id="space-hint" class="text-xs text-slate-400 mt-1"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">2. 預約日期</label>
                    <input type="date" id="date" required onchange="onSpaceOrDateChange()" class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <p id="date-warning" class="text-xs text-red-600 mt-1 hidden"></p>
                </div>
            </div>

            <!-- 步驟 2：時段圖（會議室） -->
            <div id="availability-panel" class="border rounded-lg p-4 bg-slate-50 space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <span class="text-sm font-medium text-slate-700">3. 當日時段狀況（10:00 - 18:00）</span>
                    <button type="button" onclick="loadAvailability()" class="text-xs px-2 py-1 border rounded-lg bg-white hover:bg-slate-100 text-slate-600">↻ 重新整理</button>
                </div>

                <div class="flex flex-wrap gap-4 text-xs text-slate-500">
                    <span><span class="inline-block w-3 h-3 rounded bg-white border border-slate-300 align-middle mr-1"></span>可預約</span>
                    <span><span class="inline-block w-3 h-3 rounded bg-slate-200 align-middle mr-1"></span>已被預約</span>
                    <span><span class="inline-block w-3 h-3 rounded bg-indigo-600 align-middle mr-1"></span>你選的時段</span>
                </div>

                <div id="slot-grid" class="grid grid-cols-4 sm:grid-cols-8 gap-1.5"></div>

                <p id="availability-status" class="text-xs text-slate-500">正在載入當天預約狀況…</p>
                <p id="booked-summary" class="text-xs text-slate-600"></p>
                <p id="selected-summary" class="text-sm font-medium text-indigo-700"></p>
            </div>

            <!-- Hot Desk 專屬說明（選 Hot Desk 時取代時段圖） -->
            <div id="hotdesk-panel" class="border rounded-lg p-4 bg-slate-50 space-y-1 hidden">
                <p class="text-sm font-medium text-slate-700">Hot Desk 為全天使用（10:00 - 18:00），不需要選時段</p>
                <p id="hotdesk-status" class="text-xs text-slate-500">正在確認當天使用狀況…</p>
            </div>

            <!-- 會議室專屬時長與起訖時間設定 -->
            <div id="meeting-time-fields" class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">開始時間</label>
                    <select id="startTime" onchange="onStartOrDurationChange()" class="mt-1 w-full px-3 py-2 border rounded-lg outline-none"></select>
                    <p class="text-xs text-slate-400 mt-1">已被預約、或加上時長會衝到的開始時間會自動停用，也可以直接點上面的時段格。</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">使用時長</label>
                    <select id="duration" onchange="onStartOrDurationChange()" class="mt-1 w-full px-3 py-2 border rounded-lg outline-none">
                        <option value="30">30 分鐘</option>
                        <option value="60" selected>60 分鐘 (1小時)</option>
                        <option value="90">90 分鐘 (1.5小時)</option>
                        <option value="120">120 分鐘 (2小時)</option>
                    </select>
                </div>
            </div>

            <!-- 步驟 3：預約人資料 -->
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">預約人姓名</label>
                    <input type="text" id="name" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="您的姓名">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">公司 / 組織名稱</label>
                    <input type="text" id="company" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="公司名稱">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">使用人數（含訪客）</label>
                    <input type="number" id="peopleCount" min="1" value="1" required oninput="checkPeopleCount()" class="mt-1 w-full px-3 py-2 border rounded-lg outline-none">
                    <p id="people-warning" class="text-xs text-red-600 mt-1 hidden"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">預約用途 / 活動名稱</label>
                    <input type="text" id="purpose" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="例：內部討論、客戶會議">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition disabled:opacity-50">確認送出預約</button>
            <p class="text-xs text-center text-slate-400">送出時後端會再檢查一次時段衝突，就算空檔圖來不及更新也不會重複預約。</p>
        </form>

        <div id="result-msg" class="text-center text-sm font-medium hidden rounded-lg p-3"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyq7u7lOWdnksGKzLnJjr983IJrC-1R3bFvfqO09V71fl3T2qEjYAx4fXX6NX6jG5UpFA/exec";
        const OPEN_MIN = 10 * 60;    // 10:00
        const CLOSE_MIN = 18 * 60;   // 18:00
        const STEP = 30;
        const CAPACITY = { "Room A": 10, "Room B": 8, "Room C": 8, "Room B & C": 16, "Hot Desk": null };
        const YEAR_END_START = "2026-12-26";
        const YEAR_END_END = "2027-01-03";

        let booked = [];             // [{s: 600, e: 660}, ...] 單位：分鐘
        let availabilityLoaded = false;
        let availabilityError = false;

        // ---------- 時間小工具 ----------
        function timeToMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
        function minToTime(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
        function overlaps(aS, aE, bS, bE) { return aS < bE && aE > bS; }  // 半開區間，與後端一致
        function isBooked(s, e) { return booked.some(b => overlaps(s, e, b.s, b.e)); }
        function fits(startMin, duration) { return startMin + duration <= CLOSE_MIN && !isBooked(startMin, startMin + duration); }

        function todayInTokyo() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        function dateStatus(dateStr) {
            if (!dateStr) return { closed: false, reason: "" };
            if (dateStr < todayInTokyo()) return { closed: true, reason: "這個日期已經過去了，請選今天以後的日期。" };
            const [y, m, d] = dateStr.split('-').map(Number);
            const dow = new Date(y, m - 1, d).getDay();
            if (dow === 0 || dow === 6) return { closed: true, reason: "週末不開放預約，請選平日。" };
            if (dateStr >= YEAR_END_START && dateStr <= YEAR_END_END) return { closed: true, reason: "年末年初休假期間（12/26 - 1/3）不開放預約。" };
            return { closed: false, reason: "" };
        }

        // ---------- 空檔查詢 ----------
        async function loadAvailability() {
            const space = document.getElementById("space").value;
            const date = document.getElementById("date").value;
            const statusEl = document.getElementById("availability-status");
            const hotStatus = document.getElementById("hotdesk-status");

            availabilityLoaded = false;
            availabilityError = false;

            if (space !== "Hot Desk") statusEl.textContent = "正在載入當天預約狀況…";
            if (space === "Hot Desk") hotStatus.textContent = "正在確認當天使用狀況…";

            if (!date) { renderAll(); return; }

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "availability", space: space, date: date })
                });
                const result = await response.json();
                if (result.status !== "success") throw new Error(result.message || "availability error");

                booked = (result.booked || []).map(b => ({ s: timeToMin(b.startTime), e: timeToMin(b.endTime) }));

                if (space === "Hot Desk") {
                    const n = result.hotDeskCount || 0;
                    hotStatus.textContent = n > 0
                        ? "當天已有 " + n + " 筆 Hot Desk 預約。Hot Desk 為流動辦公桌，仍可預約。"
                        : "當天目前沒有其他 Hot Desk 預約。";
                }
                availabilityLoaded = true;
            } catch (err) {
                // 查不到空檔不要擋住使用者：照常顯示空格，送出時後端會再把關
                booked = [];
                availabilityError = true;
                if (space === "Hot Desk") hotStatus.textContent = "無法載入當天使用狀況，仍可直接預約。";
            }
            renderAll();
        }

        // ---------- 畫面渲染 ----------
        function renderSlots() {
            const grid = document.getElementById("slot-grid");
            const space = document.getElementById("space").value;
            if (space === "Hot Desk") return;

            const duration = parseInt(document.getElementById("duration").value);
            const startVal = document.getElementById("startTime").value;
            const selStart = startVal ? timeToMin(startVal) : null;

            grid.innerHTML = "";
            for (let t = OPEN_MIN; t < CLOSE_MIN; t += STEP) {
                const cellBooked = isBooked(t, t + STEP);
                const inSelected = selStart !== null && t >= selStart && t < selStart + duration;

                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = minToTime(t) + (cellBooked ? " 已訂" : "");
                btn.className = "text-xs py-1.5 rounded border transition " + (
                    cellBooked ? "bg-slate-200 text-slate-400 border-slate-200 cursor-not-allowed"
                    : inSelected ? "bg-indigo-600 text-white border-indigo-600 font-medium"
                    : "bg-white text-slate-700 border-slate-300 hover:border-indigo-400 hover:text-indigo-700"
                );
                btn.disabled = cellBooked;
                btn.onclick = () => pickStart(t);
                grid.appendChild(btn);
            }

            const statusEl = document.getElementById("availability-status");
            const summaryEl = document.getElementById("booked-summary");
            if (availabilityError) {
                statusEl.textContent = "⚠ 無法載入當天預約狀況（後端可能尚未更新到 v2），時段圖僅供參考，送出時系統會再檢查衝突。";
                summaryEl.textContent = "";
            } else if (availabilityLoaded) {
                const now = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                statusEl.textContent = booked.length === 0
                    ? "當天目前沒有任何預約，全部時段都可以選。（最後更新 " + now + "）"
                    : "灰色時段已被預約，點白色格子就能選開始時間。（最後更新 " + now + "）";
                summaryEl.textContent = booked.length === 0 ? ""
                    : "當天已預約：" + booked.map(b => minToTime(b.s) + " - " + minToTime(b.e)).join("、");
            }

            const selEl = document.getElementById("selected-summary");
            if (selStart !== null && fits(selStart, duration)) {
                selEl.textContent = "你選的時段：" + document.getElementById("date").value + " " +
                    minToTime(selStart) + " - " + minToTime(selStart + duration) + "（" + duration + " 分鐘）";
            } else {
                selEl.textContent = "";
            }
        }

        function renderStartOptions() {
            const sel = document.getElementById("startTime");
            const duration = parseInt(document.getElementById("duration").value);
            const prev = sel.value;
            sel.innerHTML = "";

            let firstFit = null;
            for (let t = OPEN_MIN; t < CLOSE_MIN; t += STEP) {
                const opt = document.createElement("option");
                opt.value = minToTime(t);
                const ok = fits(t, duration);
                opt.disabled = !ok;
                opt.textContent = minToTime(t) + (ok ? "" : "（不可選）");
                if (ok && firstFit === null) firstFit = minToTime(t);
                sel.appendChild(opt);
            }

            if (prev && fits(timeToMin(prev), duration)) {
                sel.value = prev;
            } else if (firstFit) {
                sel.value = firstFit;
            }

            const noSlot = firstFit === null;
            document.getElementById("submit-btn").disabled = noSlot && document.getElementById("space").value !== "Hot Desk";
            if (noSlot && document.getElementById("space").value !== "Hot Desk" && availabilityLoaded) {
                document.getElementById("availability-status").textContent = "當天以這個時長來看，已經沒有可預約的時段了，請換日期或縮短時長。";
            }
        }

        function renderAll() {
            renderStartOptions();
            renderSlots();
            checkPeopleCount();
            updateDateWarning();
        }

        function pickStart(t) {
            const duration = parseInt(document.getElementById("duration").value);
            if (!fits(t, duration)) {
                alert("從 " + minToTime(t) + " 開始的 " + duration + " 分鐘會碰到已有預約，或超過 18:00。請點其他格子，或縮短時長。");
                return;
            }
            document.getElementById("startTime").value = minToTime(t);
            renderAll();
        }

        function updateDateWarning() {
            const date = document.getElementById("date").value;
            const st = dateStatus(date);
            const el = document.getElementById("date-warning");
            el.textContent = st.reason;
            el.classList.toggle("hidden", !st.closed);
            if (st.closed) document.getElementById("submit-btn").disabled = true;
            else if (document.getElementById("space").value !== "Hot Desk") renderStartOptionsStateOnly();
        }

        // 日期沒關閉時，把 submit 的 disabled 交回 renderStartOptions 的結果
        function renderStartOptionsStateOnly() {
            const duration = parseInt(document.getElementById("duration").value);
            const sel = document.getElementById("startTime");
            document.getElementById("submit-btn").disabled = !(sel.value && fits(timeToMin(sel.value), duration));
        }

        function checkPeopleCount() {
            const space = document.getElementById("space").value;
            const cap = CAPACITY[space];
            const n = parseInt(document.getElementById("peopleCount").value || "0");
            const el = document.getElementById("people-warning");
            const hint = document.getElementById("space-hint");
            hint.textContent = cap ? ("人數上限 " + cap + " 人") : "全天使用，不需選時段";
            if (cap && n > cap) {
                el.textContent = "提醒：這個空間上限 " + cap + " 人，你填了 " + n + " 人，可能要改選更大的空間（例如 Room B & C）。";
                el.classList.remove("hidden");
            } else {
                el.classList.add("hidden");
            }
        }

        // ---------- 事件處理 ----------
        function toggleSpaceFields() {
            const space = document.getElementById("space").value;
            const isHot = space === "Hot Desk";
            document.getElementById("meeting-time-fields").classList.toggle("hidden", isHot);
            document.getElementById("availability-panel").classList.toggle("hidden", isHot);
            document.getElementById("hotdesk-panel").classList.toggle("hidden", !isHot);
            if (isHot) document.getElementById("submit-btn").disabled = dateStatus(document.getElementById("date").value).closed;
        }

        function onSpaceOrDateChange() {
            toggleSpaceFields();
            updateDateWarning();
            loadAvailability();
        }

        function onStartOrDurationChange() {
            renderAll();
        }

        function addMinutes(timeStr, minutes) {
            return minToTime(timeToMin(timeStr) + minutes);
        }

        // ---------- 送出預約（payload 與舊版相同） ----------
        async function submitBooking(event) {
            event.preventDefault();
            const btn = document.getElementById("submit-btn");
            const msg = document.getElementById("result-msg");

            const space = document.getElementById("space").value;
            const date = document.getElementById("date").value;
            const startTime = document.getElementById("startTime").value;
            const duration = parseInt(document.getElementById("duration").value);
            const endTime = (space === "Hot Desk") ? "18:00" : addMinutes(startTime, duration);

            const st = dateStatus(date);
            if (st.closed) { alert(st.reason); return; }

            if (space !== "Hot Desk") {
                if (endTime > "18:00") { alert("預約結束時間不得超過下午 18:00 營業時間限制。"); return; }
                // 用手邊最新的空檔再擋一次，真的撞到就先刷新給使用者看
                if (availabilityLoaded && isBooked(timeToMin(startTime), timeToMin(endTime))) {
                    alert("這個時段剛好被預約了，空檔圖已更新，請重新選擇。");
                    loadAvailability();
                    return;
                }
            }

            const payload = {
                password: "hub2026", // 保持相容，後端驗證可保留或忽略
                space: space,
                date: date,
                startTime: (space === "Hot Desk") ? "10:00" : startTime,
                endTime: endTime,
                name: document.getElementById("name").value,
                company: document.getElementById("company").value,
                peopleCount: document.getElementById("peopleCount").value,
                purpose: document.getElementById("purpose").value
            };

            btn.disabled = true;
            btn.textContent = "處理中...";
            msg.classList.add("hidden");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                msg.classList.remove("hidden");
                if (result.status === "success") {
                    msg.className = "text-center text-sm font-medium text-green-700 bg-green-50 rounded-lg p-3";
                    msg.textContent = "預約成功！" + date + " " +
                        (space === "Hot Desk" ? "全天" : startTime + " - " + endTime) +
                        "（" + space + "）已同步至 Google 日曆與試算表。";
                    // 只清預約人資料，保留空間／日期／時段，方便接著訂下一筆
                    ["name", "company", "purpose"].forEach(id => document.getElementById(id).value = "");
                    document.getElementById("peopleCount").value = 1;
                    loadAvailability();  // 讓剛訂的時段馬上變灰
                } else {
                    msg.className = "text-center text-sm font-medium text-red-700 bg-red-50 rounded-lg p-3";
                    msg.textContent = "預約失敗：" + result.message;
                    loadAvailability();  // 失敗多半是剛被別人訂走，刷新空檔
                }
                msg.scrollIntoView({ behavior: "smooth", block: "center" });
            } catch (err) {
                msg.classList.remove("hidden");
                msg.className = "text-center text-sm font-medium text-red-700 bg-red-50 rounded-lg p-3";
                msg.textContent = "發生網路錯誤，請稍後再試。";
            } finally {
                btn.textContent = "確認送出預約";
                // disabled 狀態交回日期／空檔邏輯決定
                updateDateWarning();
                if (document.getElementById("space").value !== "Hot Desk" && !dateStatus(date).closed) renderStartOptions();
                else btn.disabled = dateStatus(date).closed;
                renderSlots();
            }
        }

        // ---------- 初始化 ----------
        (function init() {
            const dateInput = document.getElementById("date");
            let d = todayInTokyo();
            // 若今天休館（週末／年末），自動跳到下一個開放日，少讓使用者白選一次
            let guard = 0;
            while (dateStatus(d).closed && dateStatus(d).reason.indexOf("已經過去") === -1 && guard < 370) {
                const [y, m, dd] = d.split('-').map(Number);
                const next = new Date(y, m - 1, dd + 1);
                d = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0') + '-' + String(next.getDate()).padStart(2, '0');
                guard++;
            }
            dateInput.min = todayInTokyo();
            dateInput.value = d;
            toggleSpaceFields();
            loadAvailability();
        })();
    </script>
</body>
</html>
