<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Hub 空間預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">Startup Island TAIWAN</h1>
            <p class="text-sm text-slate-500 mt-1">Tokyo Hub 空間預約系統</p>
        </div>

        <!-- 預約表單畫面 (直接顯示，不需密碼) -->
        <form id="booking-form" class="space-y-4" onsubmit="submitBooking(event)">
            <div>
                <label class="block text-sm font-medium text-slate-700">選擇預約空間</label>
                <select id="space" onchange="toggleSpaceFields()" class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Room A">Meeting Room A (上限 10 人)</option>
                    <option value="Room B">Meeting Room B (上限 8 人)</option>
                    <option value="Room C">Meeting Room C (上限 8 人)</option>
                    <option value="Room B & C">Room B & C 聯通大空間</option>
                    <option value="Hot Desk">Hot Desk (流動辦公桌/全天)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">預約日期</label>
                <input type="date" id="date" required class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <!-- 會議室專屬時長與起訖時間設定 -->
            <div id="meeting-time-fields" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">開始時間 (10:00 - 17:30)</label>
                    <select id="startTime" class="mt-1 w-full px-3 py-2 border rounded-lg outline-none">
                        <option value="10:00">10:00</option>
                        <option value="10:30">10:30</option>
                        <option value="11:00">11:00</option>
                        <option value="11:30">11:30</option>
                        <option value="12:00">12:00</option>
                        <option value="12:30">12:30</option>
                        <option value="13:00">13:00</option>
                        <option value="13:30">13:30</option>
                        <option value="14:00">14:00</option>
                        <option value="14:30">14:30</option>
                        <option value="15:00">15:00</option>
                        <option value="15:30">15:30</option>
                        <option value="16:00">16:00</option>
                        <option value="16:30">16:30</option>
                        <option value="17:00">17:00</option>
                        <option value="17:30">17:30</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700">使用時長</label>
                    <select id="duration" class="mt-1 w-full px-3 py-2 border rounded-lg outline-none">
                        <option value="30">30 分鐘</option>
                        <option value="60" selected>60 分鐘 (1小時)</option>
                        <option value="90">90 分鐘 (1.5小時)</option>
                        <option value="120">120 分鐘 (2小時)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">預約人姓名</label>
                <input type="text" id="name" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="您的姓名">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">公司 / 組織名稱</label>
                <input type="text" id="company" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="公司名稱">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">使用人數（含訪客）</label>
                <input type="number" id="peopleCount" min="1" value="1" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700">預約用途 / 活動名稱</label>
                <input type="text" id="purpose" required class="mt-1 w-full px-3 py-2 border rounded-lg outline-none" placeholder="例：內部討論、客戶會議">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">確認送出預約</button>
        </form>

        <div id="result-msg" class="text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        function toggleSpaceFields() {
            const space = document.getElementById("space").value;
            const timeFields = document.getElementById("meeting-time-fields");
            if (space === "Hot Desk") {
                timeFields.classList.add("hidden");
            } else {
                timeFields.classList.remove("hidden");
            }
        }

        // 輔助函式：將 "HH:MM" 加上分鐘數計算出結束時間
        function addMinutes(timeStr, minutes) {
            const [hours, mins] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, mins + minutes, 0);
            return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
        }

        async function submitBooking(event) {
            event.preventDefault();
            const btn = document.getElementById("submit-btn");
            const msg = document.getElementById("result-msg");
            
            const space = document.getElementById("space").value;
            const date = document.getElementById("date").value;
            const startTime = document.getElementById("startTime").value;
            const duration = parseInt(document.getElementById("duration").value);
            
            // 計算結束時間
            const endTime = (space === "Hot Desk") ? "18:00" : addMinutes(startTime, duration);

            // 若會議室結束時間超過 18:00 則攔截
            if (space !== "Hot Desk" && endTime > "18:00") {
                alert("預約結束時間不得超過下午 18:00 營業時間限制。");
                return;
            }

            const payload = {
                password: "hub2026", // 保持相容，後端驗證可保留或忽略
                space: space,
                date: date,
                startTime: (space === "Hot Desk") ? "10:00" : startTime,
                endTime: endTime,
                name: document.getElementById("name").value,
                company: document.getElementById("company").value,
                peopleCount: document.getElementById("peopleCount").value,
                purpose: document.getElementById("purpose").value
            };

            btn.disabled = true;
            btn.textContent = "處理中...";
            msg.classList.add("hidden");

            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbyq7u7lOWdnksGKzLnJjr983IJrC-1R3bFvfqO09V71fl3T2qEjYAx4fXX6NX6jG5UpFA/exec", {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                msg.classList.remove("hidden");
                if (result.status === "success") {
                    msg.className = "text-center text-sm font-medium text-green-600";
                    msg.textContent = "預約成功！已同步至 Google 日曆與試算表。";
                    document.getElementById("booking-form").reset();
                    toggleSpaceFields();
                } else {
                    msg.className = "text-center text-sm font-medium text-red-600";
                    msg.textContent = "預約失敗：" + result.message;
                }
            } catch (err) {
                msg.classList.remove("hidden");
                msg.className = "text-center text-sm font-medium text-red-600";
                msg.textContent = "發生網路錯誤，請稍後再試。";
            } finally {
                btn.disabled = false;
                btn.textContent = "確認送出預約";
            }
        }
    </script>
</body>
</html>
